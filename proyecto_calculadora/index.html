<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master en Construcción - Inicio</title><link rel="stylesheet" href="css/estilos.css"><script src="js/app.js" defer></script>
</head>
<body>
<main class="contenedor">
  <section class="titulo"><div class="linea"></div><h1>MASTER EN CONSTRUCCIÓN</h1><p>INICIO DE SESIÓN</p><div class="linea"></div></section>
  <div class="mensaje" role="alert"></div>
  <form id="login-form" class="panel login">
    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" type="text" placeholder="tu_usuario" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" placeholder="Mínimo 6 caracteres" autocomplete="current-password" required>
    <p class="campo-ayuda">Tus datos se validan en el servidor local.</p>
    <button class="boton" type="submit">INICIAR SESIÓN</button>
    <div class="separador"><span>o</span></div>
    <a class="boton secundario" href="registro.html">CREAR CUENTA NUEVA</a>
  </form>
  <div class="pie">CONSTRUYE CON PRECISIÓN · CALCULA CON CONFIANZA</div>
</main>
</body>
</html>
