<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Techo</title><link rel="stylesheet" href="css/estilos.css"><script src="js/app.js" defer></script></head>
<body><main class="contenedor">
<a class="volver" href="menu.html">← VOLVER AL MENÚ</a><div class="mensaje" role="alert"></div>
<form class="panel formulario calculo-form" data-tipo="techo">
<h1>🏠 TECHO</h1><p class="subtitulo">Registra las medidas del techo para estimar los materiales.</p>
<label for="espesor">Espesor (m)</label><input id="espesor" name="espesor" type="number" step="0.01" min="0.01" placeholder="ej: 0.12" required>
<label for="ancho">Ancho (m)</label><input id="ancho" name="ancho" type="number" step="0.01" min="0.01" placeholder="ej: 5.00" required>
<label for="largo">Largo (m)</label><input id="largo" name="largo" type="number" step="0.01" min="0.01" placeholder="ej: 8.00" required>
<div class="botones"><button class="boton" type="submit">⚙ CALCULAR Y GUARDAR</button><button class="boton naranja" type="reset">✕ LIMPIAR</button></div>
</form><div class="pie">CONSTRUYE CON PRECISIÓN · CALCULA CON CONFIANZA</div></main></body></html>
