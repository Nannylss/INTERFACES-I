<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muro de ladrillo</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/app.js" defer></script>
</head>
<body>
<main class="contenedor">
<a class="volver" href="menu.html">← VOLVER AL MENÚ</a>
<div class="mensaje" role="alert"></div>
    <form class="panel formulario calculo-form" data-tipo="muro">
    <h1>🧱 MURO DE LADRILLO</h1><p class="subtitulo">Ingresa las dimensiones del muro para estimar los materiales.</p>
    <label>Espesor del muro</label>
<div class="opciones">
    <label class="opcion">
    <input type="radio" name="espesor" value="0.2" required>20 CM</label>
    <label class="opcion">
    <input type="radio" name="espesor" value="0.3" checked>30 CM</label>
</div>
    <label for="largo">Largo (m)</label>
    <input id="largo" name="largo" type="number" step="0.01" min="0.01" placeholder="ej: 6.00" required>
    <label for="alto">Alto (m)</label>
    <input id="alto" name="alto" type="number" step="0.01" min="0.01" placeholder="ej: 2.80" required>
    <div class="botones"><button class="boton" type="submit">⚙ CALCULAR Y GUARDAR</button>
    <button class="boton naranja" type="reset">✕ LIMPIAR</button></div>
</form>
<div class="pie">CONSTRUYE CON PRECISIÓN · CALCULA CON CONFIANZA</div>
</main>
</body>
</html>
